name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Both packages. Includes the protocol smoke test, which spawns a real
      # stdio server, and the transport tests, which spawn the hosted server.
      - run: npm run test:unit --workspaces
      - run: npm pack --dry-run -w @xyteai/mcp
      # The published package must not carry the hosted server's code or its
      # pg dependency. One OS is enough: the tarball is the same everywhere.
      - name: Packed @xyteai/mcp has no pg and no hosted-server code
        if: matrix.os == 'ubuntu-latest'
        run: node packages/mcp/scripts/assert-pack-no-pg.mjs

  pg-store:
    # The OAuth store contract against a real Postgres. Service containers only
    # run on Linux runners, so this is its own job rather than a matrix leg.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # The remote package imports the shared modules from @xyteai/mcp's dist;
      # oauth-http.test.ts spawns the built remote server (its dist/index.js).
      - run: npm run build -w @xyteai/mcp -w @xyteai/mcp-remote
      - run: npm run test:unit -w @xyteai/mcp-remote -- tests/oauth-store.test.ts tests/pg-migrations.test.ts tests/oauth-http.test.ts tests/oauth-provider.test.ts

  catalog-shape:
    # The generator needs a hub checkout, which CI does not have, so validate the
    # committed artifact's shape instead of regenerating it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # GitHub shows the root copies, npm the package copies; keep them identical.
      - name: Root README and LICENSE match the published package's copies
        run: |
          cmp README.md packages/mcp/README.md
          cmp LICENSE packages/mcp/LICENSE
      - name: Validate committed catalog
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { catalogVersion, endpoints } = JSON.parse(
              readFileSync("packages/mcp/src/catalog/endpoints.generated.json", "utf8")
            );
            const fail = (m) => { console.error("FAIL " + m); process.exit(1); };

            if (catalogVersion !== 1) fail("unexpected catalogVersion " + catalogVersion);
            if (!Array.isArray(endpoints) || endpoints.length < 50) {
              fail("expected at least 50 endpoints, got " + endpoints?.length);
            }

            const keys = new Set();
            for (const e of endpoints) {
              if (keys.has(e.key)) fail("duplicate key " + e.key);
              keys.add(e.key);
              if (!["organization", "partner"].includes(e.authScope)) {
                fail(e.key + " has non-operator authScope " + e.authScope);
              }
              if (!e.pathTemplate.startsWith("/")) fail(e.key + " path is not absolute");
              if (e.pathTemplate.includes("{{")) fail(e.key + " path has an unresolved variable");
              const inTemplate = [...e.pathTemplate.matchAll(/:(\w+)/g)].map((m) => m[1]);
              if (JSON.stringify(inTemplate) !== JSON.stringify(e.pathParams)) {
                fail(e.key + " pathParams disagree with pathTemplate");
              }
              if (e.mutating !== !["GET", "HEAD"].includes(e.method)) {
                fail(e.key + " mutating flag disagrees with method");
              }
            }
            console.error("OK " + endpoints.length + " endpoints validated");
          '

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      # Gate on what actually ships: the runtime dependencies of both packages
      # (the published @xyteai/mcp: @modelcontextprotocol/sdk and zod; the
      # hosted server adds express and pg). `files` publishes just dist/ +
      # README, so a devDependency advisory cannot reach a user.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Dev-tree advisories still matter for our own supply chain, so keep them
      # visible — but they must not block a release of unaffected shipped code.
      - name: Audit dev dependencies (report only)
        continue-on-error: true
        run: npm audit --audit-level=high
